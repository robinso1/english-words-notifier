name: English word reminder

on:
  schedule:
    # Morning window 9-13 MSK = 6-10 UTC
    - cron: "0 6-10 * * *"
    # Evening window 17-22 MSK = 14-19 UTC
    - cron: "0 14-19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force-send now (bypass window/probability check)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run reminder check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_FIRE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python3 notify.py

      - name: Commit updated state
        run: |
          if ! git diff --quiet state.json 2>/dev/null; then
            git config user.name "english-words-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "update reminder state"
            git push
          fi
