name: English word reminder

on:
  schedule:
    # Waking hours 7-23 MSK = 4-20 UTC, every 15min, no gap between the
    # morning/evening windows notify.py defines internally
    # (GitHub silently drops/delays scheduled triggers under load, so more
    # frequent + gapless is what makes delivery actually reliable)
    - cron: "*/15 4-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force-send now (bypass window/already-sent check)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: english-words-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run reminder check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_FIRE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python3 notify.py

      - name: Commit updated state
        run: |
          if ! git diff --quiet state.json 2>/dev/null; then
            git config user.name "english-words-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "update reminder state"
            git push
          fi
